target-version = "py312"
exclude = ["gnss-sdr"]

[lint]
select = ["E4", "E7", "E9", "F", "B"]

[lint.per-file-ignores]
# These modules are generated by protoc; their descriptor globals are injected
# dynamically by protobuf's builder before the generated references execute.
"src/antijamming/gnss/sdr_bridge/protobuf/*_pb2.py" = ["E712", "F821"]
# These standalone entry points intentionally prepare sys.path/environment
# before importing project and UHD modules.
"tools/summarize_lcmv_run.py" = ["E402"]
"tools/usrp_source_count_snapshot.py" = ["E402"]
